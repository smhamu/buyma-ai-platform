# Explicit forward proxy for approved Production API traffic only.
http_port 3128

acl CONNECT method CONNECT
acl SSL_ports port 443
acl openai_api dstdomain -n api.openai.com
acl slack_webhook dstdomain -n hooks.slack.com
acl aws_ssm dstdom_regex -i ^ssm\.[a-z0-9-]+\.amazonaws\.com$

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow CONNECT openai_api
http_access allow CONNECT slack_webhook
http_access allow CONNECT aws_ssm
http_access deny all

# Do not retain request destinations or headers. CONNECT payloads remain encrypted.
access_log none
cache_store_log none
cache deny all
via off
forwarded_for delete

# Suppress operational request context as well as access logs.
cache_log /dev/null
logfile_rotate 0
coredump_dir /tmp

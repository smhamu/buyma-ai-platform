services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: buyma_ai_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: buyma_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg17
    container_name: buyma_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buyma_ai
      POSTGRES_USER: buyma_user
      POSTGRES_PASSWORD: buyma_password
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyma_user -d buyma_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buyma_ai_backend
    restart: unless-stopped
    env_file:
      - ./.env.development
    environment:
      NOTIFICATION_SECRET_STORE: memory
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./.env.development:/app/.env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buyma_ai_celery_worker
    restart: unless-stopped
    env_file:
      - ./.env.development
    environment:
      NOTIFICATION_SECRET_STORE: memory
    volumes:
      - ./backend:/app
      - ./.env.development:/app/.env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buyma_ai_celery_beat
    restart: unless-stopped
    env_file:
      - ./.env.development
    environment:
      NOTIFICATION_SECRET_STORE: memory
    volumes:
      - ./backend:/app
      - ./.env.development:/app/.env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

volumes:
  postgres_data:

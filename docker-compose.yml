services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: buyma_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buyma_ai
      POSTGRES_USER: buyma_user
      POSTGRES_PASSWORD: buyma_password
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyma_user -d buyma_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buyma_ai_backend
    restart: unless-stopped
    env_file:
      - ./.env.development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./.env.development:/app/.env.development
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: